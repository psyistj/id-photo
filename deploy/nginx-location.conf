# Include inside the hub.plustech.cc HTTPS server, before its catch-all route.
location = /id-photo {
    return 308 /id-photo/$is_args$args;
}

location ^~ /id-photo/ {
    alias /srv/id-photo/current/;
    index index.html;
    autoindex off;
    # Unhashed single-page bundle (index.html/style.css/app.js): revalidate on every visit.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # All cropping and export happens in-page: the document must never reach the network.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'none'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}
